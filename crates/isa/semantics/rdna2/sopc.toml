# SOPC forms of the gfx1030 semantic registry; included by ../rdna2.toml.
# Data only; see the root file for the field meanings.

# ---- Stage D: SOPC 32-bit integer compares (#215) ----
# Only SCC is written: SCC = relation(S0, S1), S0 = SSRC0 on the left (guide 12.4).

[operand_rules.sopc_scalar]
family = "SOPC"
src = [
  { field = "SSRC0", class = "scalar_source" },
  { field = "SSRC1", class = "scalar_source" },
]
max_literals = 1
unsupported = [
  "src_vcc", "src_exec", "src_m0", "src_ttmp", "src_float_inline",
  "src_special", "two_literals",
]

[[form]]
name = "S_CMP_EQ_I32"
family = "SOPC"
opcode = 0
variant = "CmpEqI32"
operation = "compare"
relation = "eq"
signedness = "signed"
carry_in = "none"
width = 32
scc = "relation"
vcc = "unchanged"
exec = "unchanged"
wave = "any"
operands = "sopc_scalar"
spec = [
  { document = "guide", section = "12.4", page = 0 },
  { document = "guide", section = "5.3", page = 33 },
]
verify = ["reference", "independent", "metal", "llvm_encoding"]


# Bit tests with a register index address memory beyond the operand when the
# destination is memory, so that form is register-only here.
[[form]]
op = "bt"
map = "0f"
opcode = 0xA3
enc = "rm_reg"
size = "v"
register_only = true

[[form]]
op = "bts"
map = "0f"
opcode = 0xAB
enc = "rm_reg"
size = "v"
register_only = true

[[form]]
op = "btr"
map = "0f"
opcode = 0xB3
enc = "rm_reg"
size = "v"
register_only = true

[[form]]
op = "btc"
map = "0f"
opcode = 0xBB
enc = "rm_reg"
size = "v"
register_only = true

# Groups whose digits select an operation: [opcode, size, immediate, encoding].
[[group]]
map = "0f"
opcodes = [[0xBA, "v", "ib", "rm_imm"]]
digits = { 4 = "bt", 5 = "bts", 6 = "btr", 7 = "btc" }

[[group]]
opcodes = [[0xF6, "b", "", "rm"], [0xF7, "v", "", "rm"]]
digits = { 2 = "not", 3 = "neg", 4 = "mul", 5 = "imul", 6 = "div", 7 = "idiv" }

[[group]]
opcodes = [[0xFE, "b", "", "rm"], [0xFF, "v", "", "rm"]]
digits = { 0 = "inc", 1 = "dec" }

[[group]]
opcodes = [[0xC0, "b", "ib", "rm_imm"], [0xC1, "v", "ib", "rm_imm"], [0xD0, "b", "", "rm_one"], [0xD1, "v", "", "rm_one"], [0xD2, "b", "", "rm_cl"], [0xD3, "v", "", "rm_cl"]]
digits = { 0 = "rol", 1 = "ror", 4 = "shl", 5 = "shr", 7 = "sar" }

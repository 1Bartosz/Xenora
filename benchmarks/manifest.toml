# Benchmark corpus for the Phase 01 correctness-gated harness.
#
# Supported subset: `[[fixture]]` tables with string and integer-array values.
# A shader is timed only after it passes correctness in the same run. `sizes`
# are word counts for the one-invocation-per-word synthetic ABI.
# See docs/testing/benchmarks.md for the protocol and metadata fields.


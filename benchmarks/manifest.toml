name = "add"
stage = "compute"
source = "translated-rdna"
path = "fixtures/rdna2/add.bin"
input = [0, 1, 4294967295, 3989547400]
expected = [305419896, 305419897, 305419895, 0]
sizes = [4, 64, 256, 1024, 4096]


[package]
name = "xenora-semantic-review"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "known_answers.rs"

[features]
native-mutation = []

[[example]]
name = "semantic-mutation"
path = "../mutation/semantic.rs"
required-features = ["native-mutation"]

[dev-dependencies]
xenora-metal = { path = "../../crates/metal" }
xenora-ref = { path = "../../crates/ref" }
xenora-shader = { path = "../../crates/shader" }

[lints]
workspace = true

name: Agent task
description: A self-contained work item that a contributor or coding agent can claim with /claim.
title: "task: "
labels: [agent:ready]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which owner area the work belongs to. Shared work needs agreement from both owners before it is claimed.
      options:
        - gpu
        - cpu
        - shared
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the task is finished, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Paths the task may edit, one per line. Two claimed tasks never share a path.
      render: text
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance command
      description: The exact command whose success proves the task is done. It must fail before the change.
      render: sh
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must be closed first, for example "#12, #15". Leave empty when none.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Specification sections, interface notes and known limits. Public sources only.

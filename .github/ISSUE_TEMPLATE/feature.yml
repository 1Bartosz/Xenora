name: Feature proposal
description: Propose a compiler, graphics, tooling or other project enhancement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: Which limitation does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the intended behavior and affected components. Link relevant public specifications when available.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: What observable results and tests would demonstrate completion?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include limitations, dependency costs or impacts on native ARM64 and Metal if relevant.

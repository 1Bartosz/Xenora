name: Hardware verification report
description: Submit real hardware test results for Xenora.
title: "hardware: "
labels: [needs-verification]
body:
  - type: textarea
    id: environment
    attributes:
      label: Test environment
      description: Commit, Apple chip/GPU, RAM, macOS, Xcode/Metal version, Rust version, validation settings. Do not include serial numbers or registry IDs.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and inputs
      description: Include exact commands and synthetic or authorized fixture identifiers.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Report actual output, pass/fail/skip counts, and limitations. Compilation alone does not prove execution.
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: Performance data (optional)
      description: Include repetitions, warm-up, timing method, validation state and variability if reporting measurements.
